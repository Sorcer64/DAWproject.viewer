<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAWproject Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#25272b; --face:#2c2f34; --raise:#383c42; --line:#42464d; --line2:#565b63;
  --ink:#ece8df; --dim:#a8a9a6; --faint:#7b7e82;
  --amber:#f5b942; --led:#7bd88f;
  --row:27px; --treeW:440px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.35 Bahnschrift,"DIN Alternate","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  display:grid;grid-template-rows:auto 1fr;overflow:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
[hidden]{display:none!important}

/* top bar */
#bar{display:flex;align-items:center;gap:22px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--face);min-width:0}
#title{all:unset;cursor:pointer;font-size:21px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#title:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#app{color:var(--dim);white-space:nowrap}
#stats{display:flex;gap:20px;margin:0;padding:0 0 0 22px;border-left:1px solid var(--line2);list-style:none;white-space:nowrap;overflow:hidden;flex:1;min-width:0}
#stats li b{font-weight:600;font-size:16px;margin-right:4px}
#stats li{color:var(--dim)}
#stats li b{color:var(--ink)}
.btn{background:var(--raise);border:1px solid var(--line2);border-radius:3px;padding:5px 12px;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.main{background:var(--amber);border-color:var(--amber);color:#22201a;font-weight:600}
.btn.main:hover{filter:brightness(1.08)}

/* layout */
#main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
#scroll{overflow:auto;min-height:0;position:relative;outline-offset:-2px}
#head{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:var(--treeW) minmax(0,1fr);background:var(--face);border-bottom:1px solid var(--line2);height:50px}
#headL{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;min-width:0}
#levels{display:flex;flex:none}
#levels .btn{border-radius:0;margin-left:-1px;padding:5px 9px}
#levels .btn:first-child{border-radius:3px 0 0 3px;margin-left:0}
#levels .btn:last-child{border-radius:0 3px 3px 0}
#levels .btn:hover{position:relative}
#filter{flex:1;min-width:60px;background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:5px 9px}
#filter::placeholder{color:var(--faint)}
#headR{position:relative;border-left:1px solid var(--line);overflow:hidden}
#split{position:absolute;left:calc(var(--treeW) - 4px);top:0;bottom:0;width:8px;cursor:col-resize;z-index:4}
#split:hover{background:linear-gradient(var(--amber),var(--amber)) 50% 0/2px 100% no-repeat}
.mk{position:absolute;top:5px;height:18px;padding-left:6px;border-left:2px solid var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:18px}
.tick{position:absolute;bottom:3px;padding-left:4px;border-left:1px solid var(--line2);color:var(--faint);font-size:12px;line-height:15px;height:17px}
.noTl #head,.noTl .row{grid-template-columns:minmax(0,1fr)}
.noTl #headR,.noTl .tl,.noTl #split{display:none}

/* tree rows */
.row{display:grid;grid-template-columns:var(--treeW) minmax(0,1fr);height:var(--row);cursor:default;scroll-margin-top:58px;scroll-margin-bottom:8px}
.row:hover{background:#31353a}
.row.sel{background:var(--raise);box-shadow:inset 3px 0 0 var(--amber)}
.cell{display:flex;align-items:center;min-width:0;padding:0 12px 0 8px}
.ind{flex:none;width:18px;align-self:stretch;background:linear-gradient(var(--line),var(--line)) 8px 0/1px 100% no-repeat}
.chev{flex:none;width:18px;height:18px;display:grid;place-items:center;color:var(--dim);border-radius:3px}
.chev svg{transition:transform .12s}
.chev.open svg{transform:rotate(90deg)}
.chev:not(.none):hover{background:var(--line);color:var(--ink)}
.ico{flex:none;width:16px;height:16px;margin-right:7px;display:grid;place-items:center;color:var(--dim)}
.sw{width:11px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.28)}
.sw.none{background:none;border:1px dashed var(--faint)}
.led{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint)}
.led.on{background:var(--led);border-color:var(--led);box-shadow:0 0 5px rgba(123,216,143,.55)}
.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:24px}
.sub{color:var(--dim);margin-left:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 9999 auto;min-width:0}
.meta{margin-left:auto;padding-left:14px;display:flex;gap:14px;color:var(--dim);white-space:nowrap;flex:none;font-size:13px}
.row.off .lbl,.row.off .sub{color:var(--faint)}
.k-track>.cell .lbl,.k-top>.cell .lbl{font-weight:600}
.k-top{margin-top:2px}
mark{background:rgba(245,185,66,.3);color:inherit;border-radius:2px}

/* timeline cells */
.tl{position:relative;border-left:1px solid var(--line);background:var(--grid,none);overflow:hidden}
.blk{position:absolute;top:7px;bottom:7px;min-width:2px;border-radius:2px;border-right:1px solid rgba(0,0,0,.5);cursor:pointer}
.blk.off{opacity:.35}
.blk:hover{filter:brightness(1.25)}
.k-clip .blk,.k-slot .blk{top:9px;bottom:9px}
.tk{position:absolute;top:4px;bottom:4px;width:2px}
.seg{position:absolute;top:10px;bottom:10px;opacity:.28;border-radius:2px}
.tl svg{position:absolute;inset:3px 0;width:100%;height:calc(100% - 6px)}
.tl polyline,.big polyline{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}

/* inspector */
#inspector{border-left:1px solid var(--line2);background:var(--face);overflow:auto;padding:16px 20px 28px;min-height:0}
.crumbs{color:var(--faint);font-size:13px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:2px 6px}
.crumbs .link{color:var(--dim)}
.link{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--amber);color:var(--ink)}
.link:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#inspector h2{font-size:23px;font-weight:600;line-height:1.15;margin:0 0 4px;overflow-wrap:anywhere;display:flex;gap:10px;align-items:baseline}
#inspector h2 .sw{flex:none;width:13px;height:13px;transform:translateY(1px)}
.desc{color:var(--dim);margin:0 0 16px}
#inspector h3{font-size:14px;font-weight:600;color:var(--dim);margin:20px 0 9px;padding-top:13px;border-top:1px solid var(--line)}
dl.props{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 18px;margin:0}
dl.props dt{color:var(--dim)}
dl.props dd{margin:0;overflow-wrap:anywhere}
.flow{list-style:none;margin:0;padding:0}
.flow li{position:relative;padding:5px 0 5px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow li::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--line2)}
.flow li:first-child::before{top:50%}
.flow li:last-child::before{bottom:50%}
.flow li::after{content:"";position:absolute;left:4px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;background:var(--face);border:1px solid var(--dim)}
.flow li.f-dev::after{display:none}
.flow li.f-dev .led{position:absolute;left:3px}
.flow li.f-snd::after{border-radius:0;transform:rotate(45deg);border-color:var(--amber)}
.flow li.off{color:var(--faint)}
.flow small{color:var(--dim);font-size:13px}
.pm{display:grid;grid-template-columns:minmax(0,1fr) 84px 76px;gap:10px;align-items:center;padding:3px 0}
.pm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm span:last-child{text-align:right;color:var(--dim)}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--amber);border-radius:3px}
.big{display:block;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:3px}
.big text{fill:var(--faint);font-size:10px}
table.list{border-collapse:collapse;width:100%}
table.list td{padding:3px 12px 3px 0;vertical-align:top}
table.list td:last-child{padding-right:0;text-align:right;color:var(--dim);white-space:nowrap}
table.list td.mid{color:var(--dim);white-space:nowrap}
table.list td.gantt{width:38%;vertical-align:middle}
audio{width:100%;height:36px;margin-top:4px}
details.raw{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
details.raw summary{cursor:pointer;color:var(--dim)}
details.raw dl{margin-top:10px}
details.raw code{font-family:inherit;color:var(--dim)}
.note{color:var(--dim);font-size:13px;margin:8px 0 0}

/* view switch, export menu */
#bar{position:relative}
.seg2{display:flex;flex:none}
.seg2 .btn{border-radius:0;margin-left:-1px}
.seg2 .btn:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg2 .btn:last-child{border-radius:0 3px 3px 0}
.seg2 .btn:hover{position:relative}
.seg2 .btn[aria-pressed="true"]{background:var(--bg);border-color:var(--amber);color:var(--amber);position:relative;z-index:1}
#exportMenu{position:absolute;right:18px;top:calc(100% - 4px);z-index:20;background:var(--raise);border:1px solid var(--line2);border-radius:4px;padding:5px;display:flex;flex-direction:column;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#exportMenu button{all:unset;cursor:pointer;padding:8px 12px;border-radius:3px}
#exportMenu button:hover,#exportMenu button:focus-visible{background:var(--line)}
#exportMenu small{display:block;color:var(--dim);font-size:12px}

/* timeline zoom and hover ruler */
#headR{cursor:zoom-in;touch-action:none}
#zoombox{position:absolute;right:6px;bottom:4px;z-index:5;display:flex;align-items:center;gap:6px;background:var(--face);padding-left:8px}
#zoombox span{color:var(--dim);font-size:12px;white-space:nowrap}
#zoombox .btn{padding:0 7px;height:22px;line-height:20px;font-size:13px}
.noTl #zoombox{display:none}
.selband{position:absolute;top:0;bottom:0;background:rgba(245,185,66,.22);border-left:1px solid var(--amber);border-right:1px solid var(--amber);pointer-events:none;z-index:2}
#hover{position:fixed;width:1px;background:var(--amber);opacity:.75;pointer-events:none;z-index:6}
#hoverTag{position:fixed;z-index:7;pointer-events:none;background:var(--amber);color:#22201a;font-size:12px;font-weight:600;padding:1px 6px;border-radius:2px;white-space:nowrap;transform:translateX(-50%)}

/* section map */
#scroll,#map{grid-column:1;grid-row:1}
#map{overflow:auto;min-height:0;--mapL:230px}
.mapnote{color:var(--dim);font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.mgrid{display:grid;min-width:max-content}
.mc{all:unset;box-sizing:border-box;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:30px;display:flex;align-items:center;position:relative}
button.mc{cursor:pointer}
button.mc:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.mc.corner,.mc.mh{position:sticky;top:0;z-index:3;background:var(--face);height:62px;border-bottom-color:var(--line2)}
.mc.corner{left:0;z-index:4;padding:0 12px;color:var(--dim);align-items:flex-end;padding-bottom:9px}
.mc.mh{flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 8px 0;box-shadow:inset 0 3px 0 var(--mcol);gap:1px}
.mc.mh b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mc.mh small{color:var(--dim);font-size:12px;white-space:nowrap}
.mc.mh:hover,.mc.ml:hover{background:#31353a}
.mc.ml{position:sticky;left:0;z-index:2;background:var(--bg);padding-right:10px;gap:8px;border-right-color:var(--line2)}
.mc.ml .lbl{flex:1}
.mc.ml small{color:var(--faint);font-size:12px}
.mc.ml.grp .lbl{font-weight:600}
.mc.cl:hover{background:#31353a}
.mb{position:absolute;top:6px;bottom:6px;min-width:2px;border-radius:2px;border-right:1px solid rgba(0,0,0,.5)}
.mb.off{opacity:.35}
.mc.cl.grp .mb{opacity:.4;top:11px;bottom:11px}
.mc .wave{position:absolute;right:3px;top:1px;color:var(--amber);width:14px;height:14px;display:grid;place-items:center;background:var(--bg);border-radius:2px}
.mc.sum{background:var(--face);height:auto;min-height:30px;padding:5px 8px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px;font-size:13px;color:var(--dim)}
.mc.sum.ml{color:var(--ink)}
.mc.sum b{color:var(--ink);font-weight:600}
.mc.sum .bar{height:5px}
.mc.colsel{background:rgba(245,185,66,.07)}
.mc.mh.colsel{background:var(--raise)}
.mc.cellsel{outline:2px solid var(--amber);outline-offset:-2px}
.btn.wide{margin-top:16px}

#report{display:none}
.ver{color:var(--faint);font-size:12px;margin:22px 0 0!important}
.preset{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:3px;padding:10px 12px}
.pname{font-size:19px;font-weight:600;overflow-wrap:anywhere}
.psub{color:var(--dim);margin-top:2px}
.pdesc{margin:8px 0 0;font-style:italic;color:var(--ink)}
p.where{color:var(--faint);font-size:12px;margin:10px 0 5px;overflow-wrap:anywhere}
dl.kv dt code{font-family:Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12.5px;color:var(--amber)}
dl.kv dd{font-size:13.5px}
details.raw h4{font-size:13px;color:var(--dim);font-weight:600;margin:14px 0 6px}
p.path{font-family:Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere;margin:0 0 4px;color:var(--ink)}
ul.texts{margin:0;padding-left:18px;font-size:13px}
ul.texts li{overflow-wrap:anywhere}
ul.texts small{color:var(--faint)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);margin:0;background:#4a2b25;border:1px solid #a8573f;color:#ffd9cf;padding:9px 16px;border-radius:4px;z-index:9;max-width:80vw}

/* empty state */
#empty{display:grid;place-items:center;padding:24px}
#drop{width:min(620px,100%);border:1.5px dashed var(--line2);border-radius:6px;padding:44px 44px 40px;background:var(--face)}
#drop h2{font-size:30px;font-weight:600;margin:0 0 10px;line-height:1.1}
#drop p{color:var(--dim);margin:0 0 22px;max-width:52ch}
#err{color:#ff9d8a;margin:18px 0 0!important}
body.drag #drop,body.drag #scroll{outline:2px dashed var(--amber);outline-offset:-6px}

@media (max-width:1020px){
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,42%)}
  #inspector{border-left:0;border-top:1px solid var(--line2)}
  #stats li:nth-child(n+5){display:none}
}
@media (max-width:640px){
  #bar{flex-wrap:wrap;gap:8px 14px} #stats{display:none} #title{max-width:60vw}
}
@media (prefers-reduced-motion:reduce){.chev svg{transition:none}}

/* printed summary */
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{height:auto;overflow:visible;background:#fff;color:#16171a;display:block;font-size:10.5pt}
  body>*:not(#report){display:none!important}
  #report{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report h1{font-size:22pt;margin:0 0 2px;font-weight:600}
  #report h2{font-size:13pt;margin:16px 0 6px;font-weight:600;break-after:avoid}
  #report .rbreak{break-before:page}
  .rsub,.rnote{color:#666;margin:0 0 8px;font-size:9pt}
  .rfacts{display:flex;flex-wrap:wrap;gap:4px 22px;margin:8px 0 4px}
  .rfacts dt{color:#666;font-size:8.5pt}
  .rfacts dd{margin:0;font-weight:600}
  #report table{border-collapse:collapse;width:100%}
  #report tr{break-inside:avoid}
  #report th{text-align:left;font-weight:600;font-size:9pt;padding:4px 6px;border-bottom:1.5px solid #888;vertical-align:bottom}
  #report th small{font-weight:400;color:#666}
  #report td{padding:3px 6px;border-bottom:1px solid #ddd;vertical-align:top}
  .rmap th,.rmap td{border-right:1px solid #ddd}
  .rmap td.rname{white-space:nowrap;width:1%;font-size:9.5pt}
  .rmap tr.grp td.rname{font-weight:600}
  .rmap td.rcell{padding:0;height:17px;vertical-align:middle}
  .rmap td.rcell div{position:relative;height:17px}
  .rmap td.rcell i{position:absolute;top:3px;bottom:3px;border-radius:1.5px;border-right:1px solid rgba(0,0,0,.35)}
  .rmap tr.grp td.rcell i{opacity:.45;top:6px;bottom:6px}
  .rwave{position:absolute;right:2px;top:0;font-weight:700;color:#b07a00;font-size:9pt;line-height:15px}
  .rmap tr.rtot td{font-weight:600;font-size:9pt;border-top:1.5px solid #888}
  .rsw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
  .rtracks td{font-size:9.5pt}
  .rtracks td:nth-child(1){width:17%}.rtracks td:nth-child(2){width:27%}.rtracks td:nth-child(3){width:32%}.rtracks td:nth-child(4){width:24%}
  .rtracks td small{color:#666}
}
</style>
</head>
<body>

<header id="bar">
  <button id="title" title="Show the project overview">DAWproject Viewer</button>
  <span id="app"></span>
  <ul id="stats"></ul>
  <div id="views" class="seg2" role="group" aria-label="View" hidden>
    <button class="btn" data-view="tree" aria-pressed="true" title="Tracks, devices and clips as a tree against the timeline">Tree</button>
    <button class="btn" data-view="map" aria-pressed="false" title="Which tracks play in each section">Section map</button>
  </div>
  <button id="exportBtn" class="btn" aria-haspopup="menu" aria-expanded="false" hidden>PDF Export</button>
  <div id="exportMenu" role="menu" hidden>
    <button role="menuitem" data-export="print">Print or save as PDF<small>A summary page with the section map</small></button>
    <button role="menuitem" data-export="md">Save as Markdown<small>The same summary as a .md text file</small></button>
  </div>
  <button id="open" class="btn main">Open project</button>
  <input type="file" id="file" accept=".dawproject,.xml,.zip" hidden>
</header>

<main id="main" hidden>
  <div id="scroll" tabindex="0" role="tree" aria-label="Project structure">
    <div id="head">
      <div id="headL">
        <input id="filter" type="search" placeholder="Filter by name" aria-label="Filter the tree">
        <div id="levels" role="group" aria-label="How much of the tree to show">
          <button class="btn" data-level="0" title="One row per track">Overview</button>
          <button class="btn" data-level="1" title="Tracks with their instruments and effects">Devices</button>
          <button class="btn" data-level="2" title="Open every branch">Everything</button>
        </div>
      </div>
      <div id="headR" aria-hidden="true" title="Drag to zoom in, click a section name to zoom to it, double-click to see the whole song"></div>
      <div id="split" title="Drag to resize"></div>
      <div id="zoombox" role="group" aria-label="Timeline zoom">
        <span id="zoomText"></span>
        <button class="btn" data-zoom="out" title="Zoom out (minus key)" aria-label="Zoom out">−</button>
        <button class="btn" data-zoom="in" title="Zoom in (plus key, or Ctrl and the mouse wheel)" aria-label="Zoom in">+</button>
        <button class="btn" data-zoom="fit" title="Whole song (0 key)">Fit</button>
      </div>
    </div>
    <div id="rows"></div>
  </div>
  <div id="map" hidden></div>
  <aside id="inspector" aria-live="polite"></aside>
</main>

<div id="hover" hidden></div>
<div id="hoverTag" hidden></div>
<p id="toast" role="alert" hidden></p>
<div id="report"></div>

<section id="empty">
  <div id="drop">
    <h2>Drop a .dawproject file here</h2>
    <p>See every track with its instruments, effects, sends, clips and automation laid out as a tree against the song timeline. The file is read on this computer and never uploaded.</p>
    <button id="choose" class="btn main">Choose a file</button>
    <p id="err" hidden></p>
    <p class="ver">DAWproject Viewer <span id="ver"></span></p>
  </div>
</section>

<script>
'use strict';
const VERSION = '1.2';
/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)){
    if (k == null || k === false || k === '') continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}

/* ---------- reading the .dawproject archive (a zip) ---------- */
async function openZip(buf){
  const dv = new DataView(buf), n = buf.byteLength;
  let e = -1;
  for (let i = n - 22; i >= Math.max(0, n - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error('This file could not be read as a DAWproject archive.');
  let count = dv.getUint16(e + 10, true), off = dv.getUint32(e + 16, true);
  if ((off === 0xFFFFFFFF || count === 0xFFFF) && e >= 20 && dv.getUint32(e - 20, true) === 0x07064b50){
    const e64 = Number(dv.getBigUint64(e - 12, true));
    count = Number(dv.getBigUint64(e64 + 32, true)); off = Number(dv.getBigUint64(e64 + 48, true));
  }
  const td = new TextDecoder(), files = new Map();
  let p = off;
  for (let i = 0; i < count && p + 46 <= n; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    let csize = dv.getUint32(p + 20, true), size = dv.getUint32(p + 24, true), lo = dv.getUint32(p + 42, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const name = td.decode(new Uint8Array(buf, p + 46, nl));
    let x = p + 46 + nl; const xe = x + xl;
    while (x + 4 <= xe){
      const id = dv.getUint16(x, true), sz = dv.getUint16(x + 2, true);
      if (id === 1){
        let q = x + 4;
        if (size === 0xFFFFFFFF){ size = Number(dv.getBigUint64(q, true)); q += 8; }
        if (csize === 0xFFFFFFFF){ csize = Number(dv.getBigUint64(q, true)); q += 8; }
        if (lo === 0xFFFFFFFF) lo = Number(dv.getBigUint64(q, true));
      }
      x += 4 + sz;
    }
    if (!name.endsWith('/')) files.set(name, {name, method, csize, size, lo});
    p += 46 + nl + xl + cl;
  }
  return {buf, files};
}
async function unzip(zip, name){
  const f = zip.files.get(name);
  if (!f) return null;
  const dv = new DataView(zip.buf);
  const start = f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true);
  const raw = new Uint8Array(zip.buf, start, f.csize);
  if (f.method === 0) return raw;
  if (f.method !== 8) throw new Error('The archive uses a compression method this viewer cannot read.');
  if (typeof DecompressionStream === 'undefined') throw new Error('This browser is too old to unpack .dawproject files. Open the viewer in a current Chrome, Edge or Firefox.');
  const out = new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw')));
  return new Uint8Array(await out.arrayBuffer());
}

/* ---------- preset information inside saved plugin states ----------
   A .vstpreset is a VST3 preset: 'VST3', version, class ID, then a list of chunks
   (Comp = processor state, Cont = controller state, Info = preset metadata XML).
   What is inside Comp/Cont belongs to the plugin, so we peel known wrappers
   (JUCE 'VC2!' XML, VST2 fxp/fxb 'CcnK', Xfer JSON, zlib) and look for
   preset-like fields. In plain binary data we read text runs and use the length
   number stored in front of a text to see where it ends. */
const PRESET_KEY = /(preset|program|prg|patch|author|creator|descr|categor|collection|comment|title|^tags?$|genre|mood|style|character|profile|library|soundset|modified|^name$)/i;
const NOT_PRESET = /programchange|wtbank|^mgenre\d|^parameter\d|^program$|style\d|^osc|^lfo|^env|^filter|^fx/i;
const NAME_KEY = /(preset.?(name|title)|prg.?name|program.?name|patch.?name|profile.?name|currentpresetname|^name$|^title$)/i;
const PRESET_EXT = /\.(preset|mtpreset|fxp|fxb|vstpreset|h2p|nmsv|serumpreset|vital|spc|spcd|aupreset|bwpreset|adg|adv|patch|nki|nksf|tfx|pst|xpf|phaseplant|ksd)$/i;
const SOUND_EXT = /\.(wav|aiff?|flac|mp3|ogg|rex|rx2|sfz|wt)$/i;
const u32be = (u, p) => ((u[p] << 24) >>> 0) + (u[p + 1] << 16) + (u[p + 2] << 8) + u[p + 3];
const u32le = (u, p) => u[p] + (u[p + 1] << 8) + (u[p + 2] << 16) + ((u[p + 3] << 24) >>> 0);
const ascii = (u, a, b) => { let s = ''; for (let i = a; i < b && i < u.length; i++) s += String.fromCharCode(u[i]); return s; };
const utf8 = u => new TextDecoder('utf-8', {fatal: false}).decode(u);

async function inflate(u, format){
  const out = new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream(format)));
  return new Uint8Array(await out.arrayBuffer());
}
/* text runs in binary data, cut at the length number stored in front of them */
function textRuns(u, max){
  const out = [];
  let i = 0;
  while (i < u.length && out.length < max){
    if (u[i] < 32 || u[i] > 126){ i++; continue; }
    let j = i; while (j < u.length && u[j] >= 32 && u[j] <= 126) j++;
    if (j - i >= 4){
      let s = i, e = j, how = '';
      /* Where does the text end? A 4-byte length right in front of it is trusted even if it cuts the run short.
         When the first character is really the last byte of a length, that length must match the rest exactly. */
      for (const k of [0, 1]){
        const p = i + k, room = j - p;
        const cands = [];
        if (p >= 4) cands.push(['4-byte', u32be(u, p - 4)], ['4-byte', u32le(u, p - 4)]);
        if (k === 1) cands.push(['1-byte', u[p - 1]]);
        const hit = cands.find(c => c[1] >= 3 && (k === 0 ? c[1] <= room : c[1] === room));
        if (hit){ s = p; e = p + hit[1]; how = hit[0]; break; }
      }
      const t = ascii(u, s, e).trim();
      const letters = (t.match(/[A-Za-z]/g) || []).length;
      if (/[A-Za-z]{3}/.test(t) && letters >= t.replace(/\s/g, '').length * .5) out.push({text: t, how});
    }
    i = j;
  }
  return out;
}
function prettyKey(k){
  return k.replace(/^[_$]+/, '').replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/[_\-.:]+/g, ' ').trim().toLowerCase().replace(/^./, c => c.toUpperCase());
}
async function readPresetState(path){
  const R = {path, fields: [], more: [], texts: [], files: [], samples: [], notes: [], layers: [], settings: 0};
  let u;
  try { u = await unzip(P.zip, path); } catch (e){ R.notes.push('The saved state could not be unpacked.'); return R; }
  if (!u){ R.notes.push('The saved state file is missing from the project.'); return R; }
  const seen = new Set();
  const consider = (key, value, where) => {
    R.settings++;
    if (value == null) return;
    let v = String(value).trim();
    if (!v || v.length > 600) return;
    key = String(key);
    if (!PRESET_KEY.test(key) || NOT_PRESET.test(key)) return;
    const id = key + '\n' + v;
    if (seen.has(id)) return;
    seen.add(id);

    const idLike = /^[\w-]*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}/i.test(v) || /^[0-9a-f]{24,}$/i.test(v);

    }

    if (!head.startsWith('CcnK')){ const c = ascii(b, 0, 32).indexOf('CcnK'); if (c > 0) return walk(b.subarray(c), where, depth + 1); }

      const n = u32le(b, 9);

      await text(utf8(b.subarray(17, 17 + n)), where + ' → Xfer JSON header', depth);
      if (b.length > 17 + n + 8 && !R.notes.some(x => x.startsWith('The sound itself'))) R.notes.push('The sound itself is stored after the header in compressed form, so only the header can be read.');
      return;

          }
          if (!el.children.length && el.textContent.trim()) consider(el.getAttribute('id') || el.getAttribute('name') || el.localName, el.getAttribute('value') ?? el.textContent, w);

        const go = async (o, k, d, parent) => {
          if (d > 30) return;
          if (Array.isArray(o)){ for (const x of o.slice(0, 2000)) await go(x, k, d + 1, parent); return; }
          if (o && typeof o === 'object'){ for (const key in o) await go(o[key], key, d + 1, k); return; }
          if (/^(name|title)$/i.test(k) && d > 2 && !/preset|program|patch|info|meta/i.test(parent || '')){ R.settings++; return; }

            const v = o.trim();
            if ((v[0] === '<' || v[0] === '{') && v.length > 20){ await text(v, w + ' "' + k + '"', depth + 1); return; }

    const unesc = v => v.replace(/\\u([0-9a-fA-F]{4})/g, (x, hx) => String.fromCharCode(parseInt(hx, 16))).replace(/\\(["\\/])/g, '$1');

  }

    const cls = ascii(u, 8, 40);
    R.classId = cls;
    const lo = Number(new DataView(u.buffer, u.byteOffset).getBigUint64(40, true));
    if (lo + 8 <= u.length && ascii(u, lo, lo + 4) === 'List'){
      const n = u32le(u, lo + 4), names = {Comp: 'processor state', Cont: 'controller state', Info: 'preset information'};

        const e = lo + 8 + i * 20, id = ascii(u, e, e + 4), dv = new DataView(u.buffer, u.byteOffset);

        if (size > 0) await walk(u.subarray(off, off + size), 'VST3 preset → ' + (names[id] || id), 0);

  } else await walk(u, 'Saved state', 0);

  /* best guess at the preset name and its description */
  const pick = re => R.fields.find(f => re.test(f.key));
  const nameF = pick(NAME_KEY) || R.fields.find(f => /name|title/i.test(f.key) && /preset|program|patch/i.test(f.key));
  const fileF = R.files[0];
  R.best = {
    name: nameF ? nameF.value : fileF ? fileF.name : '',
    nameFrom: nameF ? nameF.key : fileF ? 'the preset file name' : '',
    category: (pick(/categor|type|style|genre|mood|character/i) || {}).value || '',
    collection: (pick(/collection|library|soundset|bank|pack/i) || {}).value || '',
    author: (pick(/author|creator/i) || {}).value || '',
    description: (pick(/descr|comment/i) || {}).value || '',
    modified: (() => { const f = pick(/modified/i); return f ? /^(1|true|yes)$/i.test(f.value) : null; })(),
    file: fileF ? fileF.path : ''
  };
  const pathF = fileF ? fileF.path : (R.fields.find(f => /[\\/]/.test(f.value) && /\.\w{2,12}$/.test(f.value)) || {}).value;
  if (pathF) R.best.folder = pathF.split(/[\\/]/).slice(-3, -1).filter(x => !/^(factory|presets?|user|by package)$/i.test(x)).join(' / ');

  return R;
}
async function readAllPresets(){
  const jobs = P.devices.filter(d => d.statePath && P.zip && P.zip.files.has(d.statePath));
  for (const d of jobs){
    try { d.preset = await readPresetState(d.statePath); } catch (e){ d.preset = {fields: [], more: [], texts: [], files: [], samples: [], notes: ['This saved state could not be read: ' + e.message], layers: [], best: {}}; }
    d.presetName = d.preset.best && d.preset.best.name ? d.preset.best.name : '';
  }
  return jobs.length;
}

function chanTrackEl(id){

function chanName(id){ const t = chanTrackEl(id); return t ? (t.getAttribute('name') || 'Unnamed track') : 'Unknown destination'; }

  if (!el) return 'Unknown parameter';
  const nm = el.getAttribute('name') || el.localName, p = el.parentElement;
  const send = el.closest('Send');
  if (send) return 'Send to ' + chanName(send.getAttribute('destination'));
  const dev = el.closest('Devices > *');
  if (dev) return devName(dev) + ': ' + nm;
  if (p && p.localName === 'Channel') return 'Track ' + nm.toLowerCase();
  return nm;
}
function barPos(t){
  if (P.timeUnit === 'seconds') return clock(t);
  const bar = Math.floor(t / P.bpb + 1e-9) + 1, beat = t - (bar - 1) * P.bpb;
  return beat < 1e-6 ? 'bar ' + bar : 'bar ' + bar + ', beat ' + trim(beat + 1, 2);
}
function span(d){
  if (P.timeUnit === 'seconds') return trim(d, 2) + ' s';
  const bars = d / P.bpb;
  return Math.abs(bars - Math.round(bars)) < 1e-6 && bars >= 1 ? plural(Math.round(bars), 'bar') : plural(Number(trim(d, 2)), 'beat');
}
const toSec = t => P.timeUnit === 'seconds' ? t : (P.tempo > 0 ? t * 60 / P.tempo : NaN);

function clipInfo(c){
  const t = num(c, 'time') || 0;
  let d = num(c, 'duration');
  if (isNaN(d)){ const e = num(c, 'end'); d = isNaN(e) ? 0 : e - t; }
  const notes = c.getElementsByTagName('Note');
  let lo = 128, hi = -1;
  for (const n of notes){ const k = +n.getAttribute('key'); if (k < lo) lo = k; if (k > hi) hi = k; }
  const audio = c.getElementsByTagName('Audio')[0] || null;
  const fileEl = audio && audio.getElementsByTagName('File')[0];
  return {t, d, notes: notes.length, lo, hi, audio, path: fileEl ? fileEl.getAttribute('path') || '' : '',
    external: !!fileEl && fileEl.getAttribute('external') === 'true', warps: c.getElementsByTagName('Warp').length,
    on: c.getAttribute('enable') !== 'false', name: c.getAttribute('name') || ''};
}

function build(doc, file, zip, meta){
  const root = doc.documentElement;
  P = {doc, zip, fileName: file.name, size: file.size, ids: new Map(), byEl: new Map(), byUid: new Map(),
       devices: [], tracks: [], audioUse: new Map(), stateUse: new Map(), nClips: 0, lanes: new Map(), markers: []};
  for (const e of doc.querySelectorAll('[id]')) P.ids.set(e.getAttribute('id'), e);
  P.name = file.name.replace(/\.(dawproject|xml|zip)$/i, '');

  const app = kid(root, 'Application'), tr = kid(root, 'Transport');
  P.app = app ? [app.getAttribute('name'), app.getAttribute('version')].filter(Boolean).join(' ') : '';
  const tempoEl = kid(tr, 'Tempo'), sigEl = kid(tr, 'TimeSignature');
  P.tempo = tempoEl ? num(tempoEl, 'value') : NaN;
  P.sigN = sigEl && num(sigEl, 'numerator') > 0 ? num(sigEl, 'numerator') : 4;
  P.sigD = sigEl && num(sigEl, 'denominator') > 0 ? num(sigEl, 'denominator') : 4;
  P.bpb = P.sigN * 4 / P.sigD;

  const arr = kid(root, 'Arrangement'), arrLanes = kid(arr, 'Lanes');
  P.timeUnit = (arrLanes && arrLanes.getAttribute('timeUnit')) || 'beats';
  let len = 0;
  if (arr){
    for (const el of arr.querySelectorAll('[track]')){
      const id = el.getAttribute('track'), list = P.lanes.get(id) || [];
      if (el.localName === 'Lanes') list.push(...el.children); else list.push(el);
      P.lanes.set(id, list);
    }
    for (const c of arr.getElementsByTagName('Clip')){
      const g = c.parentElement && c.parentElement.parentElement;
      if (g && g.localName === 'Clip') continue;
      const t = num(c, 'time') || 0, d = num(c, 'duration');
      len = Math.max(len, isNaN(d) ? (num(c, 'end') || t) : t + d);
    }
    for (const m of arr.getElementsByTagName('Marker')) len = Math.max(len, num(m, 'time') || 0);
    if (!len) for (const p of arr.querySelectorAll('RealPoint,BoolPoint,IntegerPoint,EnumPoint'))
      if (!p.closest('Clip')) len = Math.max(len, num(p, 'time') || 0);
  }
  P.len = len;

  const top = (label, o) => add(P.root, N('top', label, Object.assign({folder: true, ico: 'files'}, o)));
  P.root = N('root', P.name, {desc: P.app ? 'Made with ' + P.app : 'DAWproject file', open: true});

  /* song */
  const song = top('Song', {ico: 'song', desc: 'Tempo, time signature and song information'});
  if (tempoEl) add(song, N('param', 'Tempo', {el: tempoEl, meta: [fmtParam(tempoEl)], desc: 'Project tempo'}));
  if (sigEl) add(song, N('param', 'Time signature', {el: sigEl, meta: [P.sigN + '/' + P.sigD], desc: 'Project time signature'}));
  const lenText = P.len ? (P.timeUnit === 'seconds' ? clock(P.len) : plural(Math.ceil(P.len / P.bpb - 1e-9), 'bar')) : '';
  const lenClock = P.len && !isNaN(toSec(P.len)) ? clock(toSec(P.len)) : '';
  if (P.len) add(song, N('param', 'Length', {meta: [lenText, P.timeUnit === 'seconds' ? '' : lenClock], desc: 'Where the last clip, marker or automation point ends',
    props: [['Length', lenText], ['Duration', lenClock + (P.timeUnit === 'seconds' ? '' : ' at ' + trim(P.tempo, 2) + ' bpm')]]}));
  for (const tag of ['TempoAutomation', 'TimeSignatureAutomation']){
    const a = kid(arr, tag);
    if (a) add(song, autoNode(a, null, tag === 'TempoAutomation' ? 'Tempo changes' : 'Time signature changes'));
  }
  const info = [];
  if (meta) for (const m of meta.documentElement.children) info.push([m.localName.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase()).replace(/ (\w)/g, (s, c) => ' ' + c.toLowerCase()), m.textContent.trim()]);
  for (const [k, v] of info) if (v) add(song, N('param', k, {meta: [v], desc: 'Song information', props: [[k, v]]}));
  song.props = [['Tempo', tempoEl ? fmtParam(tempoEl) : 'Not set'], ['Time signature', P.sigN + '/' + P.sigD], ['Length', [lenText, lenClock].filter(Boolean).join(', ') || 'Empty arrangement'],
    ...info.map(([k, v]) => [k, v || 'Not filled in'])];
  song.meta = [isNaN(P.tempo) ? '' : trim(P.tempo, 2) + ' bpm', P.sigN + '/' + P.sigD];

  /* tracks */
  const tracks = top('Tracks', {ico: 'tracks', open: true});
  for (const el of (kid(root, 'Structure') || {children: []}).children) if (el.localName === 'Track' || el.localName === 'Channel') add(tracks, trackNode(el));
  tracks.meta = [String(P.tracks.length)];
  tracks.desc = plural(P.tracks.length, 'track') + ' in this project';

  /* markers */
  const mEls = arr ? [...arr.getElementsByTagName('Marker')] : [];
  P.markers = mEls.map(m => ({t: num(m, 'time') || 0, name: m.getAttribute('name') || 'Marker', color: safeColor(m.getAttribute('color')) || '#f5b942', el: m})).sort((a, b) => a.t - b.t);
  if (P.markers.length){
    const mk = top('Markers', {ico: 'marker', meta: [String(P.markers.length)], desc: 'Cue markers that divide the song into sections', extra: 'sections',
      tl: {ticks: P.markers.map(m => ({t: m.t, color: m.color}))}});
    P.markers.forEach((m, i) => {
      const end = i + 1 < P.markers.length ? P.markers[i + 1].t : P.len, d = Math.max(0, end - m.t);
      m.d = d;
      add(mk, N('marker', m.name, {el: m.el, color: m.color, meta: [barPos(m.t), d > 0 ? span(d) : ''], desc: 'Cue marker',
        tl: {ticks: [{t: m.t, color: m.color}], segs: d > 0 ? [{t: m.t, d, color: m.color}] : []},
        props: [['Position', barPos(m.t)], ['Time', isNaN(toSec(m.t)) ? null : clock(toSec(m.t))], ['Section length', d > 0 ? span(d) : 'Ends the song']]}));
    });
  }

  /* scenes */
  const scEls = [...(kid(root, 'Scenes') || {children: []}).children].filter(e => e.localName === 'Scene');
  if (scEls.length){
    const sc = top('Scenes', {ico: 'scene', desc: 'Clip launcher scenes'});
    let filled = 0;
    for (const s of scEls){
      const slots = [...s.getElementsByTagName('ClipSlot')].filter(x => kid(x, 'Clip'));
      const sn = add(sc, N('scene', s.getAttribute('name') || 'Scene', {el: s, meta: [slots.length ? plural(slots.length, 'clip') : 'Empty'], on: slots.length > 0, desc: 'Clip launcher scene',
        props: [['Launcher clips', String(slots.length)], ['Slots', String(s.getElementsByTagName('ClipSlot').length)], ['Comment', s.getAttribute('comment')]]}));
      for (const sl of slots){
        const c = kid(sl, 'Clip'), ci = clipInfo(c), tEl = P.ids.get(sl.getAttribute('track')), tn = tEl && P.byEl.get(tEl);
        filled++;
        add(sn, N('slot', ci.name || 'Unnamed clip', {el: c, sub: tn ? tn.label : '', color: tn && tn.color, meta: [span(ci.d), contentText(ci)], desc: 'Launcher clip' + (tn ? ' on ' + tn.label : ''), ci, props: clipProps(ci, c, false)}));
      }
    }
    sc.meta = [String(scEls.length), filled ? plural(filled, 'clip') : 'all empty'];
  }

  /* devices used */
  const groups = new Map();
  for (const d of P.devices){
    const key = d.format + '\n' + d.label;
    if (!groups.has(key)) groups.set(key, {name: d.label, format: d.format, role: d.roleLabel, builtin: d.builtin, uses: []});
    groups.get(key).uses.push(d);
  }
  const inv = top('Devices used', {ico: 'plug', desc: 'Every plugin and built-in device in the project, with the tracks that use it'});
  const sorted = [...groups.values()].sort((a, b) => b.uses.length - a.uses.length || a.name.localeCompare(b.name));
  for (const [title, isBuiltin] of [['Plugins', false], ['Built-in devices', true]]){
    const list = sorted.filter(g => g.builtin === isBuiltin);
    if (!list.length) continue;
    const g = add(inv, N('group', title, {folder: true, ico: 'plug', meta: [String(list.length)], open: !isBuiltin,
      desc: isBuiltin ? 'Devices that belong to the DAW itself' : 'Third-party plugins this project needs installed', extra: 'uses', list}));
    for (const it of list){
      const pn = add(g, N('plug', it.name, {ico: 'plug', meta: [it.role, it.format, it.uses.length + '×'], desc: [it.format, lowerFirst(it.role)].filter(Boolean).join(' ') + ', used ' + (it.uses.length === 1 ? 'once' : it.uses.length + ' times'),
        extra: 'uses', list: [it], props: [['Format', it.format], ['Role', it.role], ['Plugin ID', it.uses[0].el.getAttribute('deviceID')]]}));
      for (const d of it.uses) add(pn, N('use', d.track.label, {target: d, color: d.track.color, sub: d.sub, on: d.on, meta: [d.on ? '' : 'Off']}));
    }
  }
  inv.meta = [String(groups.size)];
  inv.extra = 'uses'; inv.list = sorted;
  inv.props = [['Plugin instances', String(P.devices.filter(d => !d.builtin).length)], ['Different plugins', String(sorted.filter(g => !g.builtin).length)],
               ['Built-in device instances', String(P.devices.filter(d => d.builtin).length)]];

  /* files */
  if (zip){
    const fl = top('Files in the project', {ico: 'files', meta: [String(zip.files.size), fmtBytes(file.size)], desc: 'Everything stored inside the .dawproject archive'});
    const buckets = new Map();
    for (const f of zip.files.values()){
      const dir = f.name.includes('/') ? f.name.slice(0, f.name.indexOf('/')) : '';
      if (!buckets.has(dir)) buckets.set(dir, []);
      buckets.get(dir).push(f);
    }
    const titles = {'': 'Project data', plugins: 'Plugin states', audio: 'Audio', samples: 'Samples'};
    for (const [dir, list] of [...buckets].sort((a, b) => a[0].localeCompare(b[0]))){
      const total = list.reduce((s, f) => s + f.size, 0);
      const g = add(fl, N('group', titles[dir] || dir, {folder: true, ico: dir === 'audio' || dir === 'samples' ? 'audio' : 'files', meta: [String(list.length), fmtBytes(total)], desc: dir ? 'Folder "' + dir + '" in the archive' : 'The project description itself'}));
      for (const f of list.sort((a, b) => a.name.localeCompare(b.name))){
        const owner = P.stateUse.get(f.name), users = P.audioUse.get(f.name) || [];
        const isAudio = /\.(wav|aiff?|flac|mp3|ogg|m4a)$/i.test(f.name);
        add(g, N('file', owner ? owner.label + ' state' : baseName(f.name), {ico: isAudio ? 'audio' : 'files', sub: owner ? owner.track.label : '', meta: [users.length ? plural(users.length, 'clip') : (isAudio ? 'unused' : ''), fmtBytes(f.size)],
          desc: owner ? 'Saved settings of ' + owner.label + ' on ' + owner.track.label : isAudio ? 'Audio file inside the project' : 'File inside the project archive',
          path: f.name, owner, users, isAudio,
          props: [['Path', f.name], ['Size', fmtBytes(f.size)], ['Stored as', fmtBytes(f.csize) + ' compressed']]}));
      }
    }
  }
  P.root.props = [['File', P.fileName], ['Size', fmtBytes(P.size)], ['Made with', P.app], ['Tempo', isNaN(P.tempo) ? null : trim(P.tempo, 2) + ' bpm'], ['Time signature', P.sigN + '/' + P.sigD],
    ['Length', [lenText, lenClock].filter(Boolean).join(', ')], ['Tracks', String(P.tracks.length)], ['Plugin instances', String(P.devices.filter(d => !d.builtin).length)],
    ['Built-in devices', String(P.devices.filter(d => d.builtin).length)], ['Arrangement clips', String(P.nClips)], ['Audio files', zip ? String([...zip.files.keys()].filter(k => /\.(wav|aiff?|flac|mp3|ogg|m4a)$/i.test(k)).length) : null]];
  P.root.extra = 'overview';
}

function contentText(ci){ return ci.notes ? plural(ci.notes, 'note') : ci.audio ? 'Audio' : 'Empty'; }
function clipProps(ci, c, arranged){
  const ls = num(c, 'loopStart'), le = num(c, 'loopEnd'), fi = num(c, 'fadeInTime'), fo = num(c, 'fadeOutTime'), ps = num(c, 'playStart');
  const a = ci.audio;
  return [
    arranged ? ['Position', barPos(ci.t)] : null,
    ['Length', span(ci.d)],
    arranged ? ['Ends at', barPos(ci.t + ci.d)] : null,
    arranged && !isNaN(toSec(ci.t)) ? ['Time', clock(toSec(ci.t)) + ' to ' + clock(toSec(ci.t + ci.d))] : null,
    ['Enabled', ci.on ? 'Yes' : 'No'],
    !isNaN(ls) && !isNaN(le) ? ['Loop', le - ls < ci.d - 1e-6 ? span(le - ls) + ', repeated ' + trim(ci.d/(le - ls), 2) + '×' : 'Plays through once'] : null,
    ps > 0 ? ['Starts inside the clip at', span(ps)] : null,
    fi > 0 ? ['Fade in', trim(fi, 2) + ' ' + (c.getAttribute('fadeTimeUnit') || 'beats')] : null,
    fo > 0 ? ['Fade out', trim(fo, 2) + ' ' + (c.getAttribute('fadeTimeUnit') || 'beats')] : null,
    ci.notes ? ['Notes', String(ci.notes)] : null,
    ci.notes ? ['Pitch range', ci.lo === ci.hi ? noteName(ci.lo) : noteName(ci.lo) + ' to ' + noteName(ci.hi)] : null,
    a ? ['Audio file', baseName(ci.path) + (ci.external ? ' (outside the project)' : '')] : null,
    a && a.getAttribute('sampleRate') ? ['Sample rate', a.getAttribute('sampleRate') + ' Hz'] : null,
    a && a.getAttribute('channels') ? ['Channels', a.getAttribute('channels') === '2' ? 'Stereo' : a.getAttribute('channels') === '1' ? 'Mono' : a.getAttribute('channels')] : null,
    a && !isNaN(num(a, 'duration')) ? ['File length', trim(num(a, 'duration'), 2) + ' s'] : null,
    a && a.getAttribute('algorithm') ? ['Stretch mode', a.getAttribute('algorithm')] : null,
    ci.warps ? ['Warp markers', String(ci.warps)] : null,
  ];
}

function autoNode(pEl, track, forceLabel){
  const tg = kid(pEl, 'Target'), pid = tg && tg.getAttribute('parameter'), target = pid ? P.ids.get(pid) : null;
  const pts = [...pEl.children].filter(e => e.localName.endsWith('Point') && e.hasAttribute('value')).map(e => {
    const v = e.getAttribute('value');
    return {t: num(e, 'time') || 0, v: v === 'true' ? 1 : v === 'false' ? 0 : parseFloat(v), hold: e.getAttribute('interpolation') === 'hold' || e.localName !== 'RealPoint'};
  }).filter(p => !isNaN(p.v)).sort((a, b) => a.t - b.t);
  const vs = pts.map(p => p.v), dmin = Math.min(...vs), dmax = Math.max(...vs);
  let lo = target ? num(target, 'min') : NaN, hi = target ? num(target, 'max') : NaN;
  if (isNaN(lo) || isNaN(hi) || hi <= lo){ lo = dmin; hi = dmax; if (!(hi > lo)){ lo -= .5; hi += .5; } }
  const unit = pEl.getAttribute('unit') || (target && target.getAttribute('unit')), tag = target ? target.localName : '', nm = target ? target.getAttribute('name') : '';
  const f = x => fmtVal(x, unit, tag, nm);
  let label = forceLabel;
  if (!label){
    if (target) label = paramLabel(target);
    else if (tg && tg.getAttribute('expression')) label = tg.getAttribute('expression') + (tg.getAttribute('controller') ? ' CC ' + tg.getAttribute('controller') : '');
    else label = 'Automation';
  }
  const color = (track && track.color) || '#f5b942';
  return N('auto', label, {el: pEl, target, color, pts, lo, hi, ico: 'auto',
    meta: [plural(pts.length, 'point'), pts.length ? (dmin === dmax ? f(dmin) : f(dmin) + ' to ' + f(dmax)) : ''],
    desc: 'Automation lane' + (track ? ' on ' + track.label : ''), tl: {curve: {pts, lo, hi, color}},
    props: [['Controls', label], ['Points', String(pts.length)], pts.length ? ['Lowest value', f(dmin)] : null, pts.length ? ['Highest value', f(dmax)] : null,
            target && target.hasAttribute('value') ? ['Value outside automation', fmtParam(target)] : null,
            pts.length ? ['First point', barPos(pts[0].t)] : null, pts.length ? ['Last point', barPos(pts[pts.length - 1].t)] : null]});
}

function trackNode(el){
  const ch = el.localName === 'Channel' ? el : kid(el, 'Channel');
  const role = ch ? ch.getAttribute('role') || '' : '', ct = el.getAttribute('contentType') || '';
  const subs = kidsOf(el, 'Track');
  const type = role === 'master' ? 'Master' : role === 'effect' ? 'FX return' : role === 'vca' ? 'VCA' : (role === 'submix' || subs.length) ? 'Group'
    : ct === 'notes' ? 'Instrument' : ct === 'audio' ? 'Audio' : /audio/.test(ct) && /notes/.test(ct) ? 'Hybrid' : ct ? ct[0].toUpperCase() + ct.slice(1) : 'Track';
  const color = safeColor(el.getAttribute('color'));
  const n = N('track', el.getAttribute('name') || 'Unnamed track', {el, color, type, open: true, devs: []});
  P.tracks.push(n);
  const volEl = kid(ch, 'Volume'), panEl = kid(ch, 'Pan'), muteEl = kid(ch, 'Mute');
  const dest = ch && ch.getAttribute('destination');
  n.volText = volEl ? fmtParam(volEl) : ''; n.panText = panEl ? fmtPan(panEl) : '';
  n.muted = !!muteEl && muteEl.getAttribute('value') === 'true'; n.solo = !!ch && ch.getAttribute('solo') === 'true';
  n.dest = dest; n.chId = ch && ch.getAttribute('id');
  n.on = !n.muted;

  /* devices, in chain order */
  for (const d of (kid(ch, 'Devices') || {children: []}).children) n.devs.push(add(n, deviceNode(d, n)));

  /* channel strip */
  if (ch){
    const mx = add(n, N('mixer', 'Mixer', {folder: true, ico: 'mixer', meta: [n.volText, n.panText], desc: 'Channel strip of ' + n.label, extra: 'meters'}));
    if (volEl) add(mx, N('param', 'Volume', {el: volEl, meta: [n.volText], desc: 'Fader of ' + n.label}));
    if (panEl) add(mx, N('param', 'Pan', {el: panEl, meta: [n.panText], desc: 'Pan of ' + n.label, fmt: n.panText}));
    if (muteEl) add(mx, N('param', 'Mute', {el: muteEl, meta: [n.muted ? 'On' : 'Off'], desc: 'Mute switch of ' + n.label}));
    add(mx, N('param', 'Solo', {meta: [n.solo ? 'On' : 'Off'], desc: 'Solo switch of ' + n.label, props: [['Solo', n.solo ? 'On' : 'Off']]}));
    add(mx, N('route', 'Output', {ico: 'send', meta: [dest ? chanName(dest) : role === 'master' ? 'Main output' : 'Not routed'], destId: dest, desc: 'Where ' + n.label + ' sends its signal',
      props: [['Goes to', dest ? chanName(dest) : role === 'master' ? 'Main output' : 'Not routed'], ['Channels', ch.getAttribute('audioChannels')]]}));
  }

  /* sends */
  const sendEls = kidsOf(kid(ch, 'Sends'), 'Send');
  n.sends = [];
  if (sendEls.length){
    const sn = add(n, N('sends', 'Sends', {folder: true, ico: 'sends', desc: 'Sends from ' + n.label, extra: 'sendbars'}));
    for (const s of sendEls){
      const v = kid(s, 'Volume'), en = kid(s, 'Enable'), lvl = v ? num(v, 'value') : NaN;
      const enabled = !en || en.getAttribute('value') !== 'false', active = enabled && lvl > 0;
      const type = s.getAttribute('type');
      const node = add(sn, N('send', chanName(s.getAttribute('destination')), {el: s, ico: 'send', on: active, destId: s.getAttribute('destination'), lvl, active,
        meta: [!enabled ? 'Off' : lvl > 0 ? fmtDb(lvl) : 'Silent', type === 'pre' ? 'Pre' : type === 'post' ? 'Post' : ''],
        desc: 'Send from ' + n.label + (type ? ', ' + type + ' fader' : ''),
        props: [['Goes to', chanName(s.getAttribute('destination'))], ['Level', lvl > 0 ? fmtDb(lvl) : 'Silent'], ['Enabled', enabled ? 'Yes' : 'No'], ['Tap point', type === 'pre' ? 'Before the fader' : type === 'post' ? 'After the fader' : type]]}));
      n.sends.push(node);
    }
    const act = n.sends.filter(s => s.active).length;
    sn.meta = [act ? act + ' of ' + n.sends.length + ' active' : 'None active'];
    sn.on = act > 0;
  }

  /* arrangement content */
  const clipEls = [], pointEls = [];
  (function collect(list){
    for (const t of list){
      if (t.localName === 'Clips') clipEls.push(...kidsOf(t, 'Clip'));
      else if (t.localName === 'Points') pointEls.push(t);
      else if (t.localName === 'Lanes' && !t.hasAttribute('track')) collect([...t.children]);
    }
  })(P.lanes.get(el.getAttribute('id')) || []);
  const blocks = [];
  if (clipEls.length){
    const cn = add(n, N('clips', 'Clips', {folder: true, ico: 'clips', desc: 'Arrangement clips on ' + n.label}));
    n.clipsNode = cn;
    let notes = 0, audio = 0;
    for (const c of clipEls.sort((a, b) => (num(a, 'time') || 0) - (num(b, 'time') || 0))){
      const ci = clipInfo(c);
      P.nClips++;
      if (ci.notes) notes++; else if (ci.audio) audio++;
      const col = color || '#8f959d';
      const node = add(cn, N('clip', ci.name || (ci.path ? baseName(ci.path) : 'Unnamed clip'), {el: c, ico: 'clip', color: col, on: ci.on, ci,
        meta: [barPos(ci.t), span(ci.d), contentText(ci)], desc: (ci.notes ? 'Note clip' : ci.audio ? 'Audio clip' : 'Clip') + ' on ' + n.label,

  return {secs, rows, real, skipped, note, max: Math.max(1, ...secs.map(s => s.playing.length))};
}

function summary(){
  const M = P.map, plugs = P.devices.filter(d => !d.builtin), built = P.devices.filter(d => d.builtin);
  const lenBars = P.len ? (P.timeUnit === 'seconds' ? clock(P.len) : plural(Math.ceil(P.len / P.bpb - 1e-9), 'bar')) : 'empty';
  const facts = [['Made with', P.app], ['Tempo', isNaN(P.tempo) ? null : trim(P.tempo, 2) + ' bpm'], ['Time signature', P.sigN + '/' + P.sigD],
    ['Length', lenBars + (P.len && !isNaN(toSec(P.len)) && P.timeUnit !== 'seconds' ? ' (' + clock(toSec(P.len)) + ')' : '')],
    ['Tracks', String(P.tracks.length)], ['Plugins', plugs.length + ' instances of ' + new Set(plugs.map(d => d.label)).size + ' plugins'],
    ['Built-in devices', String(built.length)], ['Arrangement clips', String(P.nClips)]].filter(f => f[1]);
  const pmap = new Map();
  for (const d of plugs){ const k = d.label + '\n' + d.format; if (!pmap.has(k)) pmap.set(k, {name: d.label, format: d.format, role: d.roleLabel, tracks: []}); pmap.get(k).tracks.push(d.track.label + (d.on ? '' : ' (off)')); }
  const plugins = [...pmap.values()].sort((a, b) => b.tracks.length - a.tracks.length || a.name.localeCompare(b.name));
  const tracks = P.tracks.map(t => {
    const cl = t.tl.blocks;
    return {t, name: t.label, type: t.type, out: t.dest ? chanName(t.dest) : t.type === 'Master' ? 'Main output' : '',
      mix: [t.volText, t.panText, t.muted ? 'muted' : '', t.solo ? 'solo' : ''].filter(Boolean).join(', '),
      devs: t.devs.map(d => d.label + (d.presetName || d.sub ? ' “' + (d.presetName || d.sub) + '”' : '') + (d.on ? '' : ' (off)')),
      sends: t.sends.filter(s => s.active).map(s => s.label + ' ' + fmtDb(s.lvl)),
      clips: cl.length ? plural(cl.length, 'clip') + ', ' + barPos(Math.min(...cl.map(b => b.t))) + ' to ' + barPos(Math.max(...cl.map(b => b.t + b.d))) : '',
      autos: t.autosNode ? t.autosNode.kids.map(a => a.label) : [],
      feeds: feeders(t).map(f => f.t.label + ' (' + f.text.toLowerCase() + ')')};
  });
  return {facts, plugins, tracks, M};
}

    for (const r of M.rows) L.push(row([(r.depth ? '  '.repeat(r.depth) : '') + r.t.label + (r.grp ? ' (group)' : ''),
      ...r.cells.map(c => ((c.cov >= .995 ? '●' : c.cov > 0 ? '◐ ' + pct(c.cov) : '') + (c.moving.length ? ' ~' : '')).trim())]));
    L.push(row(['**Tracks playing**', ...M.secs.map(s => '**' + s.playing.length + '**')]));
  }
  L.push('', '## Tracks', '');
  for (const t of X.tracks){
    L.push('### ' + t.name, '', '- ' + [t.type, t.out ? 'output to ' + t.out : ''].filter(Boolean).join(', '));
    if (t.devs.length) L.push('- Devices: ' + t.devs.join(' → '));

    if (t.sends.length) L.push('- Sends: ' + t.sends.join(', '));
    if (t.feeds.length) L.push('- Receives from: ' + t.feeds.join(', '));
    if (t.clips) L.push('- Clips: ' + t.clips);
    if (t.autos.length) L.push('- Automation: ' + t.autos.join(', '));
    L.push('');
  }
  if (X.plugins.length){
    L.push('## Plugins this project needs', '', row(['Plugin', 'Format', 'Role', 'Uses', 'Tracks']), row(['---', '---', '---', '---:', '---']));
    for (const p of X.plugins) L.push(row([p.name, p.format, p.role, String(p.tracks.length), p.tracks.join(', ')]));
    L.push('');
  }
  download(P.name + ' summary.md', L.join('\n'), 'text/markdown;charset=utf-8');
}

/* ---------- loading ---------- */
async function load(file){
  const err = $('#err'), prev = P;
  err.hidden = true;
  try {
    const buf = await file.arrayBuffer();
    const sig = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));
    let xml, zip = null, meta = null;
    if (sig[0] === 0x50 && sig[1] === 0x4B){
      zip = await openZip(buf);
      const px = await unzip(zip, 'project.xml');
      if (!px) throw new Error('This archive has no project.xml inside, so it is not a DAWproject file.');
      xml = new TextDecoder().decode(px);
      const mx = await unzip(zip, 'metadata.xml').catch(() => null);
      if (mx){ const md = new DOMParser().parseFromString(new TextDecoder().decode(mx), 'application/xml'); if (!md.querySelector('parsererror')) meta = md; }
    } else xml = new TextDecoder().decode(buf);
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.querySelector('parsererror') || doc.documentElement.localName !== 'Project')
      throw new Error('This file does not contain a DAWproject description. Export the project from your DAW as .dawproject and open that file.');
    build(doc, file, zip, meta);
  } catch (e){
    const msg = (e && e.message) || 'This file could not be opened.';
    P = prev;
    if (prev){
      const t = $('#toast');
      t.textContent = file.name + ': ' + msg;
      t.hidden = false;
      clearTimeout(load.timer);
      load.timer = setTimeout(() => { t.hidden = true; }, 8000);
    } else { err.textContent = msg; err.hidden = false; }
    return;
  }
  S.filter = ''; $('#filter').value = '';
  $('#empty').hidden = true; $('#main').hidden = false;
  $('#title').textContent = P.name;
  document.title = P.name + ' – DAWproject Viewer';
  $('#app').textContent = P.app;
  const st = $('#stats');
  st.textContent = '';
  const plugs = P.devices.filter(d => !d.builtin).length;
  const stat = (v, u) => st.append(h('li', null, h('b', null, v), u));
  if (!isNaN(P.tempo)) stat(trim(P.tempo, 2), 'bpm');
  stat(P.sigN + '/' + P.sigD, '');
  if (P.len && P.timeUnit !== 'seconds') stat(String(Math.ceil(P.len / P.bpb - 1e-9)), 'bars');
  if (P.len && !isNaN(toSec(P.len))) stat(clock(toSec(P.len)), 'min');
  stat(String(P.tracks.length), P.tracks.length === 1 ? 'track' : 'tracks');
  stat(String(plugs), plugs === 1 ? 'plugin' : 'plugins');
  stat(String(P.nClips), P.nClips === 1 ? 'clip' : 'clips');
  V.a = 0; V.b = P.len;
  P.map = buildMap();
  S.mapSel = null;
  $('#views').hidden = false; $('#exportBtn').hidden = false;
  fitColumns();
  renderHead();
  render();
  $('#scroll').scrollTop = 0;
  setViewMode(S.view || 'tree');
  S.sel = P.root;
  inspect(P.root);
  const mine = P;
  readAllPresets().then(n => {
    if (!n || P !== mine) return;
    if (S.view === 'tree'){ render(); if (S.sel) inspect(S.sel); }
  }).catch(e => console.warn('Preset reading failed', e));
}

  const n = P.byUid.get(+r.dataset.uid);
  if (e.target.closest('[data-tog]')){ toggle(n); return; }
  if (n.folder && n.kids.length){ n.open = !n.open; S.sel = n; render(); inspect(n); return; }
  select(n);
});
$('#rows').addEventListener('dblclick', e => {
  const r = e.target.closest('.row');
  if (!r || e.target.closest('[data-tog]') || e.target.closest('[data-go]')) return;
  const n = P.byUid.get(+r.dataset.uid);
  if (n.kind === 'use') go(n.uid); else if (!n.folder) toggle(n);
});
$('#inspector').addEventListener('click', e => {
  const z = e.target.closest('[data-zoomsec]');
  if (z){ const s = P.map.secs[+z.dataset.zoomsec]; setViewMode('tree'); setView(s.t, s.t + s.d); return; }
  const sc = e.target.closest('[data-sec]');
  if (sc){ S.mapSel = {sec: +sc.dataset.sec}; if (S.view === 'map') renderMap(); inspectSection(+sc.dataset.sec); return; }
  const b = e.target.closest('[data-go]');
  if (b){ const n = P.byUid.get(+b.dataset.go); if (n === P.root){ if (S.view === 'map') setViewMode('tree'); S.sel = n; render(); inspect(n); } else go(b.dataset.go); }
});

/* view switch, section map, export */
$('#ver').textContent = VERSION;
$('#views').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setViewMode(b.dataset.view); });
$('#map').addEventListener('click', e => {
  const b = e.target.closest('[data-row],[data-sec]');
  if (!b) return;
  const ri = b.dataset.row == null ? null : +b.dataset.row, si = b.dataset.sec == null ? null : +b.dataset.sec;
  if (ri != null && si == null){ S.mapSel = null; renderMap(); inspect(P.map.rows[ri].t); return; }
  S.mapSel = {sec: si, row: ri};
  renderMap();
  const again = $('#map').querySelector(ri == null ? `.mh[data-sec="${si}"]` : `.cl[data-row="${ri}"][data-sec="${si}"]`);
  if (again) again.focus({preventScroll: true});
  if (ri == null) inspectSection(si); else inspectCell(ri, si);
});
$('#map').addEventListener('dblclick', e => { const b = e.target.closest('.cl'); if (b){ const s = P.map.secs[+b.dataset.sec]; setViewMode('tree'); setView(s.t, s.t + s.d); } });
const menu = $('#exportMenu'), exBtn = $('#exportBtn');
function showMenu(on){ menu.hidden = !on; exBtn.setAttribute('aria-expanded', String(on)); if (on) menu.querySelector('button').focus(); }
exBtn.addEventListener('click', e => { e.stopPropagation(); showMenu(menu.hidden); });
menu.addEventListener('click', e => { const b = e.target.closest('[data-export]'); if (!b) return; showMenu(false); if (b.dataset.export === 'md') exportMarkdown(); else exportPrint(); });
addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) showMenu(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden){ showMenu(false); exBtn.focus(); } });

/* timeline zoom: buttons, Ctrl+wheel, Shift+wheel, drag on the ruler; hover line */
$('#zoombox').addEventListener('click', e => { const b = e.target.closest('[data-zoom]'); if (!b || !P) return; const z = b.dataset.zoom; if (z === 'fit') setView(0, P.len); else zoomBy(z === 'in' ? 1/1.6 : 1.6); });
$('#scroll').addEventListener('wheel', e => {
  if (!P || !P.len || $('#scroll').classList.contains('noTl')) return;
  const r = tlRect();
  if (e.clientX < r.left) return;
  if (e.ctrlKey || e.metaKey){ e.preventDefault(); zoomBy(Math.exp(Math.max(-60, Math.min(60, e.deltaY)) * 0.01), timeAtX(e.clientX)); }
  else if (zoomed() && (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY))){ e.preventDefault(); const d = (e.shiftKey ? e.deltaY || e.deltaX : e.deltaX) / r.width * vw(); setView(V.a + d, V.b + d); }
}, {passive: false});
(function(){
  const hr = $('#headR');
  let x0 = null, band = null, moved = false, downMk = null;
  hr.addEventListener('pointerdown', e => { if (!P || !P.len || e.button !== 0) return; x0 = e.clientX; moved = false; downMk = e.target.closest('.mk'); hr.setPointerCapture(e.pointerId); e.preventDefault(); });
  hr.addEventListener('pointermove', e => {
    if (x0 == null) return;
    if (!moved && Math.abs(e.clientX - x0) < 5) return;
    moved = true;
    const r = tlRect(), l = Math.max(0, Math.min(x0, e.clientX) - r.left), w = Math.min(r.width, Math.max(x0, e.clientX) - r.left) - l;
    if (!band){ band = h('div', {class: 'selband'}); hr.append(band); }
    band.style.left = l + 'px'; band.style.width = Math.max(0, w) + 'px';
  });
  hr.addEventListener('pointerup', e => {
    if (x0 == null) return;
    const a = timeAtX(Math.min(x0, e.clientX)), b = timeAtX(Math.max(x0, e.clientX));
    if (band){ band.remove(); band = null; }
    if (moved){
      const q = P.timeUnit === 'seconds' ? 1 : (b - a > 4 * P.bpb ? P.bpb : 1);
      setView(Math.floor(a / q) * q, Math.max(Math.floor(a / q) * q + q, Math.ceil(b / q) * q));
    }
    else { const mk = downMk; if (mk && +mk.dataset.b > +mk.dataset.a){ const ma = +mk.dataset.a, mb = +mk.dataset.b; if (Math.abs(V.a - ma) < 1e-6 && Math.abs(V.b - mb) < 1e-6) setView(0, P.len); else setView(ma, mb); } }
    x0 = null;
  });
  hr.addEventListener('pointercancel', () => { if (band){ band.remove(); band = null; } x0 = null; });
  hr.addEventListener('dblclick', () => { if (P) setView(0, P.len); });
  const sc = $('#scroll'), line = $('#hover'), tag = $('#hoverTag');
  sc.addEventListener('mousemove', e => {
    if (!P || !P.len || sc.classList.contains('noTl')) return hideHover();
    const r = tlRect();
    if (e.clientX < r.left || e.clientX > r.right || e.target.closest('#zoombox')) return hideHover();
    const t = Math.max(0, timeAtX(e.clientX)), sr = sc.getBoundingClientRect(), m = sectionAt(t);
    line.hidden = false; tag.hidden = false;
    line.style.left = e.clientX + 'px'; line.style.top = r.bottom + 'px'; line.style.height = Math.max(0, sr.top + sc.clientHeight - r.bottom) + 'px';
    tag.textContent = posText(t) + (m ? '  ·  ' + m.name : '') + (isNaN(toSec(t)) || P.timeUnit === 'seconds' ? '' : '  ·  ' + clock(toSec(t)));
    const tw = tag.offsetWidth / 2;
    tag.style.left = Math.max(r.left + tw, Math.min(r.right - tw, e.clientX)) + 'px'; tag.style.top = (r.bottom + 4) + 'px';
  });
  sc.addEventListener('mouseleave', hideHover);
  sc.addEventListener('scroll', hideHover, {passive: true});
})();
$('#filter').addEventListener('input', e => { S.filter = e.target.value; render(); });
function setLevel(lv){
  for (const n of P.byUid.values())
    n.open = n === P.root || (n.kind === 'top' && n.label === 'Tracks') || (lv >= 1 && n.kind === 'track') || (lv >= 2 && n.kids.length > 0 && !n.heavy);
  render();
  $('#scroll').scrollTop = 0;
}
$('#levels').addEventListener('click', e => { const b = e.target.closest('[data-level]'); if (b && P) setLevel(+b.dataset.level); });
$('#scroll').addEventListener('keydown', e => {
  if (!P || e.target.id === 'filter' || e.target.tagName === 'BUTTON') return;
  const i = S.flat.indexOf(S.sel), n = S.flat[i];
  const move = j => { const t = S.flat[Math.max(0, Math.min(S.flat.length - 1, j))]; if (t) select(t); };
  switch (e.key){
    case '+': case '=': zoomBy(1/1.6); break;
    case '-': case '_': zoomBy(1.6); break;
    case '0': setView(0, P.len); break;
    case 'ArrowDown': move(i + 1); break;
    case 'ArrowUp': move(i < 0 ? 0 : i - 1); break;
    case 'Home': move(0); break;
    case 'End': move(S.flat.length - 1); break;
    case 'ArrowRight': if (n && n.kids.length){ if (!n.open) toggle(n, true); else move(i + 1); } break;
    case 'ArrowLeft': if (n){ if (n.open && n.kids.length) toggle(n, false); else if (n.parent && n.parent !== P.root) select(n.parent); } break;
    case 'Enter': case ' ': if (n){ if (n.kind === 'use') go(n.uid); else toggle(n); } break;
    default: return;
  }
  e.preventDefault();
});
/* column splitter */
(function(){
  const sp = $('#split'), sc = $('#scroll');
  let x0 = 0, w0 = 0;
  const mv = e => sc.style.setProperty('--treeW', Math.max(240, Math.min(sc.clientWidth - 160, w0 + e.clientX - x0)) + 'px');
  sp.addEventListener('pointerdown', e => {
    x0 = e.clientX; w0 = parseFloat(getComputedStyle(sc).getPropertyValue('--treeW')) || 440; userSized = true;
    sp.setPointerCapture(e.pointerId);
    sp.addEventListener('pointermove', mv);
    sp.addEventListener('pointerup', () => sp.removeEventListener('pointermove', mv), {once: true});
    e.preventDefault();
  });
})();
</script>
</body>
</html>
